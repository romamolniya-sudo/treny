<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#0e1014; --card:#171a21; --card2:#1e222b; --line:#262b36;
 --tx:#eef1f6; --tx2:#98a1b0; --tx3:#6b7484;
 --acc:#3987e5; --p:#3987e5; --f:#d95926; --c:#199e70;
 --ok:#199e70; --warn:#c98500; --bad:#e66767;
 --r:14px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
 font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 overscroll-behavior-y:none}
body{padding-top:var(--st)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--acc)}

#screen{padding:12px 14px calc(150px + var(--sb))}
.hd{position:sticky;top:var(--st);z-index:30;background:rgba(14,16,20,.86);
 backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
 margin:-12px -14px 12px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.hd h1{font-size:22px}
.hd .sub{color:var(--tx2);font-size:13px;margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
 padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2)}
.tiny{font-size:12px}
.sm{font-size:13px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
 background:var(--card2);border:1px solid var(--line);border-radius:11px;
 padding:11px 15px;font-weight:600;font-size:15px;color:var(--tx)}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.gh{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.4}

.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);
 border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--tx2)}
.chip.b{background:rgba(57,135,229,.14);border-color:rgba(57,135,229,.4);color:#9cc4f4}
.chip.g{background:rgba(25,158,112,.14);border-color:rgba(25,158,112,.4);color:#7ed3b2}
.chip.y{background:rgba(201,133,0,.16);border-color:rgba(201,133,0,.4);color:#e5b95c}

input:not([type=file]),textarea,select{
 width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
 padding:10px 12px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
label.lb{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px 2px}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
 background:rgba(14,16,20,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-top:1px solid var(--line);padding-bottom:var(--sb)}
#tabs button{padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
 color:var(--tx3);font-size:10px;font-weight:600}
#tabs button.on{color:var(--acc)}
#tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}

/* video */
.vwrap{position:relative;background:#000;border-radius:12px;overflow:hidden;
 aspect-ratio:9/16;max-height:64vh;margin:0 auto;width:100%}
.vwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.vph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:10px;background:var(--card2);color:var(--tx2);font-size:14px}
.vph .play{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.12);
 display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2)}
.vph .play:after{content:"";border-left:17px solid #fff;border-top:11px solid transparent;
 border-bottom:11px solid transparent;margin-left:5px}

/* exercise */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex.on{border-color:#33415a}
.exh{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:left}
.num{flex:0 0 29px;height:29px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
 display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--tx2)}
.ex.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.exb{padding:0 13px 13px}
.cues{margin:10px 0 0;padding:0;list-style:none}
.cues li{position:relative;padding-left:15px;font-size:13.5px;color:var(--tx2);margin-bottom:5px;line-height:1.4}
.cues li:before{content:"";position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--tx3)}

/* sets table */
.sets{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
.sets th{font-size:11px;color:var(--tx3);font-weight:600;text-align:left;padding:0 0 5px;text-transform:uppercase;letter-spacing:.04em}
.sets td{padding:3px 0}
.sets td:nth-child(1){width:30%;font-size:12.5px;color:var(--tx2);padding-right:4px}
.sets td:nth-child(2),.sets td:nth-child(3){width:26%;padding-right:5px}
.sets td:nth-child(4){width:18%;text-align:right}
.sets input{padding:9px 4px}
.sets input{padding:9px 8px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sets tr.warm td:nth-child(1){color:var(--tx3);font-style:italic}
.sets tr.filled input{border-color:rgba(25,158,112,.45)}
.tick{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
 display:inline-flex;align-items:center;justify-content:center;color:var(--tx3);font-size:15px}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* rest bar */
#rest{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--sb));z-index:45;
 background:var(--card2);border:1px solid #33415a;border-radius:13px;padding:10px 13px;
 display:none;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#rest.on{display:flex}
#rest .t{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;min-width:76px}
.ring{width:38px;height:38px;flex:0 0 38px}
.ring circle{fill:none;stroke-width:4}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--tx3);stroke-width:1.5;stroke-dasharray:4 4}
.chart text{fill:var(--tx3);font-size:10px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:9px}
.lgd i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* macro bars */
.mb{margin-bottom:11px}
.mb .track{height:9px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:5px;position:relative}
.mb .fill{height:100%;border-radius:5px;transition:width .3s}
.mb .tick2{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx2);opacity:.75}

.pill{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.pill button{flex:1;padding:8px 4px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--tx2)}
.pill button.on{background:var(--acc);color:#fff}

.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;display:block;background:var(--card2)}
.ph .it{position:relative}
.ph .dt{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:10px;text-align:center;
 background:linear-gradient(transparent,rgba(0,0,0,.8));border-radius:0 0 9px 9px}

details.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.acc>summary{padding:13px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;
 justify-content:space-between;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"⌄";color:var(--tx3);font-size:17px;transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(180deg)}
details.acc .in{padding:0 14px 14px}
.quote{white-space:pre-wrap;font-size:14px;color:var(--tx2);line-height:1.55}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + var(--sb));z-index:60;
 background:#2b3140;border:1px solid #3b4356;color:var(--tx);padding:10px 16px;border-radius:11px;
 font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.5);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.hr{height:1px;background:var(--line);margin:12px 0}
.empty{text-align:center;color:var(--tx3);padding:26px 12px;font-size:14px}
</style>
</head>

const DAYNAMES = {1:"Грудь + бицепс",2:"Ноги",3:"Спина + трицепс",4:"Плечи + пресс"};
const CYCLE_MONTHS = ["Месяцы 1–4","Месяцы 5–8","Месяцы 9–12"];
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const DEF = {start:null,pos:0,cycleOverride:0,active:null,hist:[],ex:{},food:{},lib:[],
             names:{},set:{carbStep:12,restSec:210},seen:false};
let S;
function load(){
  try{ S=Object.assign({},DEF,JSON.parse(localStorage.getItem("trn")||"{}"));
       S.set=Object.assign({},DEF.set,S.set||{}); }
  catch(e){ S=JSON.parse(JSON.stringify(DEF)); }
  if(!S.start) S.start=todayISO();
}
let LS_OK=true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ LS_OK=false; }
let sT; function save(){ clearTimeout(sT); sT=setTimeout(flush,120); }
function flush(){ if(!LS_OK) return; try{ localStorage.setItem("trn",JSON.stringify(S)); }catch(e){ toast("Не хватает места в браузере"); } }

/* ---------- dates ---------- */
function todayISO(d){ d=d||new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function parseISO(s){ return new Date(s+"T00:00:00"); }
function monthsSince(a,b){ const s=parseISO(a);
  let m=(b.getFullYear()-s.getFullYear())*12+(b.getMonth()-s.getMonth());
  if(b.getDate()<s.getDate()) m--; return Math.max(0,m); }
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function ruDate(iso){ const d=parseISO(iso); return d.getDate()+" "+MON[d.getMonth()]; }
function dow(iso){ return ["вс","пн","вт","ср","чт","пт","сб"][parseISO(iso).getDay()]; }

/* ---------- program position ---------- */
function curCycle(){ return S.cycleOverride||Math.min(3,1+Math.floor(monthsSince(S.start,new Date())/4)); }
function cycObj(n){ return META.cycles.find(c=>c.n===n)||META.cycles[0]; }
function nextDay(){ const c=cycObj(curCycle()); return c.days[S.pos%c.days.length]; }
function monthNo(){ return monthsSince(S.start,new Date())+1; }
function findEx(k){ for(const c of META.cycles) for(const d of c.days) for(const e of d.ex) if(e.k===k) return e;
  return META.warmup.find(x=>x.k===k); }
function nameOf(k){ const e=findEx(k); return e?e.name:k; }
function dispName(k){ return S.names[k]||nameOf(k); }

/* ---------- nutrition ---------- */
function targets(iso){
  const m=Math.min(5,monthsSince(S.start,parseISO(iso||todayISO())));
  const c=250+m*S.set.carbStep;
  return {p:155,pLo:150,pHi:160,f:75,fLo:70,fHi:80,c:c,kcal:Math.round(155*4+75*9+c*4)};
}
function dayFood(iso){ return S.food[iso]||(S.food[iso]={items:[],w:null}); }
function sumFood(iso){ const d=S.food[iso],t={p:0,f:0,c:0,kcal:0};
  if(d) d.items.forEach(i=>{t.p+=i.p;t.f+=i.f;t.c+=i.c;});
  t.kcal=Math.round(t.p*4+t.f*9+t.c*4); t.p=Math.round(t.p); t.f=Math.round(t.f); t.c=Math.round(t.c); return t; }

/* ---------- video ---------- */
function vurl(k){ return "videos/"+k+".mp4"; }
function videoHTML(k){ return '<div class="vwrap" data-vk="'+k+'"><div class="vph"><div class="play"></div>'+
  '<div class="tiny">Техника · нажми, чтобы посмотреть</div></div></div>'; }
function bindVideos(root){
  (root||document).querySelectorAll(".vwrap[data-vk]").forEach(w=>{
    if(w.dataset.b) return; w.dataset.b="1";
    w.addEventListener("click",()=>{
      if(w.querySelector("video")) return;
      w.innerHTML='<video src="'+vurl(w.dataset.vk)+'" controls playsinline preload="metadata" autoplay loop></video>';
      const v=w.querySelector("video");
      v.addEventListener("error",()=>{ w.innerHTML='<div class="vph"><div class="tiny" style="text-align:center;padding:0 18px">'+
        (navigator.onLine?"Видео не загрузилось":"Нет интернета, а это видео ещё не скачано.<br>Ещё → Офлайн-режим")+'</div></div>'; });
    });
  });
}

/* ---------- toast ---------- */
let tT; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("on"),2100); }

/* ---------- rest timer ---------- */
let rEnd=0,rTot=1,rInt=null;
function restStart(sec,lbl){ rTot=sec; rEnd=Date.now()+sec*1000;
  $("#rlbl").textContent=lbl||"Отдых между подходами"; $("#rest").classList.add("on");
  clearInterval(rInt); rInt=setInterval(restTick,200); restTick(); }
function restTick(){ const left=Math.max(0,Math.round((rEnd-Date.now())/1000));
  $("#rtime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#rring").setAttribute("stroke-dashoffset",String(113*(1-left/rTot)));
  if(left<=0){ clearInterval(rInt); rInt=null; $("#rest").classList.remove("on");
    if(navigator.vibrate) navigator.vibrate([220,90,220]); beep(); toast("Отдых окончен — следующий подход"); } }
function restStop(){ clearInterval(rInt); rInt=null; $("#rest").classList.remove("on"); }
let AC; function beep(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(); o.connect(g); g.connect(AC.destination);
  o.frequency.value=760; g.gain.setValueAtTime(.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.3,AC.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.7);
  o.start(); o.stop(AC.currentTime+.72); }catch(e){} }
function restSecFor(ex){ const m=(ex.rest||"").match(/(\d+)/); return m?Math.max(60,+m[1]*60):S.set.restSec; }

/* ---------- charts ---------- */
function barChart(vals,target,color){
  const W=320,H=76,n=vals.length||1,gap=2,bw=Math.max(3,(W-(n-1)*gap)/n);
  const mx=Math.max(target*1.25,...vals.map(v=>v.v||0),1);
  let bars="";
  vals.forEach((d,i)=>{ const h=d.v>0?Math.max(3,(d.v/mx)*H):0,x=i*(bw+gap),y=H-h;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
      '" rx="'+Math.min(4,bw/2).toFixed(1)+'" fill="'+(d.v?color:"#262b36")+'"><title>'+esc(d.l+": "+Math.round(d.v)+" г")+'</title></rect>'; });
  const ty=H-(target/mx)*H;
  return '<svg class="chart" viewBox="0 0 '+W+' '+(H+15)+'">'+bars+
    '<line class="tgt" x1="0" y1="'+ty.toFixed(1)+'" x2="'+W+'" y2="'+ty.toFixed(1)+'"/>'+
    '<text x="0" y="'+(H+12)+'">'+esc(vals[0]?vals[0].l:"")+'</text>'+
    '<text x="'+W+'" y="'+(H+12)+'" text-anchor="end">'+esc(vals.length?vals[vals.length-1].l:"")+'</text></svg>';
}
function lineChart(pts,color){
  if(pts.length<2) return '<div class="empty">Нужно минимум 2 записи, чтобы построить график</div>';
  const W=320,H=112,P=18;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const X=i=>P+i*(W-P*2)/(pts.length-1), Y=v=>16+(1-(v-mn)/rg)*(H-42);
  let d="",dots="";
  pts.forEach((p,i)=>{ d+=(i?" L ":"M ")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1);
    dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.4" fill="'+color+
      '" stroke="#171a21" stroke-width="2"><title>'+esc(p.l+": "+p.v+" кг")+'</title></circle>'; });
  const last=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
    '<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(last.v)-10).toFixed(1)+'" text-anchor="end" fill="'+color+
    '" style="font-weight:700;font-size:11px">'+last.v+' кг</text>'+
    '<text x="'+P+'" y="'+(H-4)+'">'+esc(pts[0].l)+'</text>'+
    '<text x="'+(W-P)+'" y="'+(H-4)+'" text-anchor="end">'+esc(last.l)+'</text></svg>';
}
function macroBar(lbl,val,tgt,lo,hi,color){
  const pct=Math.min(100,tgt?val/tgt*100:0), over=val>hi*1.05;
  return '<div class="mb"><div class="row sb"><span class="sm">'+lbl+'</span>'+
    '<span class="sm mono"><b>'+val+'</b><span class="muted"> / '+(lo!==hi?lo+"–"+hi:tgt)+' г</span></span></div>'+
    '<div class="track"><div class="fill" style="width:'+pct.toFixed(1)+'%;background:'+(over?"var(--warn)":color)+'"></div></div></div>';
}

/* ---------- exercise cards ---------- */
function exCard(ex,idx,mode){
  const st=S.ex[ex.k]||{};
  const a=(mode==="work"&&S.active)?S.active.ex[ex.k]:null;
  const done=a&&a.sets.some(s=>s.r);
  return '<div class="ex'+(done?" done":"")+'" id="ex-'+ex.k+'" data-k="'+ex.k+'">'+
    '<button class="exh" data-tog="'+ex.k+'"><span class="num">'+(idx===null?"Р":idx+1)+'</span>'+
    '<span class="grow"><span style="display:block;font-weight:600;font-size:15px">'+esc(dispName(ex.k))+'</span>'+
    '<span class="tiny muted trunc" style="display:block">'+esc(ex.mus)+'</span></span>'+
    (st.bump?'<span class="chip y">↑ вес</span>':'')+
    (st.last?'<span class="tiny muted mono">'+st.last.w+'×'+st.last.r+'</span>':'')+
    '</button><div class="exb" style="display:none"></div></div>';
}
function exBody(ex,mode){
  const st=S.ex[ex.k]||{};
  let h=videoHTML(ex.k);
  h+='<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:11px">'+
     '<span class="chip b">'+ex.sets+' раб. подхода</span><span class="chip">10–12 повт. в отказ</span>'+
     '<span class="chip">отдых '+esc(ex.rest)+'</span>'+
     (ex.src==="Лёха"?'<span class="chip g">схема от Лёхи</span>':'')+'</div>';
  if(ex.note) h+='<div class="sm" style="margin-top:9px;color:var(--tx2)">💬 '+esc(ex.note)+'</div>';
  h+='<ul class="cues">'+ex.cues.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>';
  if(st.bump&&st.last) h+='<div class="card tight" style="margin:11px 0 0;background:rgba(201,133,0,.1);border-color:rgba(201,133,0,.4)">'+
     '<b class="sm">↑ Пора добавить вес</b><div class="tiny muted" style="margin-top:3px">'+
     'В прошлый раз первый подход зашёл на '+st.last.r+' повторений при '+st.last.w+' кг. По правилу Лёхи — с этой тренировки повышаем.</div></div>';
  if(mode==="work") h+=setsHTML(ex);
  h+='<div style="margin-top:12px"><label class="lb">Мой комментарий к упражнению</label>'+
     '<textarea data-note="'+ex.k+'" placeholder="Что запомнить: хват, угол, на каком весе техника плывёт…">'+esc(st.note||"")+'</textarea></div>';
  return h;
}
function setsHTML(ex){
  const a=S.active.ex[ex.k]||(S.active.ex[ex.k]={warm:{w:"",r:""},sets:[],note:""});
  while(a.sets.length<ex.sets) a.sets.push({w:"",r:""});
  const st=S.ex[ex.k]||{};
  let rows='<tr class="warm"><td>Подводящий</td>'+
    '<td><input inputmode="decimal" data-s="w" data-i="-1" data-k="'+ex.k+'" value="'+esc(a.warm.w)+'" placeholder="кг"></td>'+
    '<td><input inputmode="numeric" data-s="r" data-i="-1" data-k="'+ex.k+'" value="'+esc(a.warm.r)+'" placeholder="8"></td><td></td></tr>';
  a.sets.forEach((s,i)=>{ rows+='<tr'+(s.r?' class="filled"':'')+'><td>'+(i+1)+' подход</td>'+
    '<td><input inputmode="decimal" data-s="w" data-i="'+i+'" data-k="'+ex.k+'" value="'+esc(s.w)+'" placeholder="кг"></td>'+
    '<td><input inputmode="numeric" data-s="r" data-i="'+i+'" data-k="'+ex.k+'" value="'+esc(s.r)+'" placeholder="повт"></td>'+
    '<td><button class="tick'+(s.r?" on":"")+'" data-tick="'+ex.k+'" data-i="'+i+'">✓</button></td></tr>'; });
  return '<div class="tiny muted" style="margin-top:12px">Подводящий: 60–65% от рабочего, 8 повторов — в счёт не идёт.</div>'+
    '<table class="sets"><thead><tr><th>Подход</th><th>Вес</th><th>Повторы</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="row" style="gap:8px;margin-top:9px;flex-wrap:wrap">'+
    '<button class="btn sm gh" data-addset="'+ex.k+'">+ подход</button>'+
    '<button class="btn sm gh" data-rest="'+restSecFor(ex)+'">⏱ '+Math.round(restSecFor(ex)/60)+' мин</button>'+
    (st.last?'<span class="tiny muted grow" style="text-align:right">прошлый раз '+st.last.w+'кг × '+st.last.r+'</span>':'')+'</div>';
}

function statBox(v,l){ return '<div class="grow" style="text-align:center">'+

  h+='<details class="acc"><summary>Разминка — перед каждой тренировкой</summary><div class="in">'+

  h+='<button class="btn ok wide" data-finish="1">Завершить тренировку</button>';
  return h;

function spark(t,vals,tgt,col){
  const nz=vals.filter(v=>v.v>0), avg=nz.length?Math.round(nz.reduce((a,b)=>a+b.v,0)/nz.length):0;

    '<span class="sm"><i style="width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;background:'+col+'"></i>'+t+'</span>'+
    '<span class="tiny muted mono">в среднем '+avg+' · цель '+tgt+'</span></div>'+barChart(vals,tgt,col)+'</div>';
}
function lastDays(n){ const o=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);

  return h;

/* ---------- photos ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("trn",1);
  r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains("photos")) d.createObjectStore("photos",{keyPath:"id"}); };
  r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); }); }
async function photoAll(){ try{ const db=await idb(); return await new Promise(res=>{
  const q=db.transaction("photos").objectStore("photos").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); }); }catch(e){ return []; } }
async function photoPut(o){ const db=await idb(); return new Promise(res=>{
  const t=db.transaction("photos","readwrite"); t.objectStore("photos").put(o); t.oncomplete=res; }); }
async function photoDel(id){ const db=await idb(); return new Promise(res=>{
  const t=db.transaction("photos","readwrite"); t.objectStore("photos").delete(id); t.oncomplete=res; }); }
async function loadPhotos(){ const g=$("#phgrid"); if(!g) return;
  const all=(await photoAll()).sort((a,b)=>b.id-a.id);
  g.innerHTML=all.length?all.map(p=>'<div class="it"><img src="'+p.d+'" data-ph="'+p.id+'"><div class="dt">'+ruDate(p.date)+'</div></div>').join("")
    :'<div class="empty" style="grid-column:1/-1">Пока нет фото.<br>Сделай первое сегодня — будет с чем сравнивать.</div>'; }
function addPhoto(file){ const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{ const M=900,sc=Math.min(1,M/Math.max(im.width,im.height));
    const cv=document.createElement("canvas"); cv.width=im.width*sc|0; cv.height=im.height*sc|0;
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    photoPut({id:Date.now(),date:todayISO(),d:cv.toDataURL("image/jpeg",.72)}).then(()=>{ loadPhotos(); toast("Фото добавлено"); }); };
    im.src=r.result; };
  r.readAsDataURL(file); }

/* ---------- офлайн ---------- */
let OFF={busy:false,done:0,total:0};
function allMedia(){
  const ks=new Set();
  META.cycles.forEach(c=>c.days.forEach(d=>d.ex.forEach(e=>ks.add(e.k))));
  META.warmup.forEach(w=>ks.add(w.k));
  const u=[...ks].map(k=>"videos/"+k+".mp4"); u.push("videos/voice.m4a"); return u;
}
function offBox(){
  if(!("serviceWorker" in navigator)||!location.protocol.startsWith("http"))
    return '<div class="sm muted">Офлайн работает только когда приложение открыто по ссылке GitHub Pages, а не из файла.</div>';
  if(OFF.busy) return '<div class="row sb"><span class="sm">Скачиваю видео…</span>'+
    '<span class="mono sm">'+OFF.done+' / '+OFF.total+'</span></div>'+
    '<div class="track" style="margin-top:7px"><div class="fill" style="width:'+
    (OFF.total?OFF.done/OFF.total*100:0).toFixed(1)+'%;background:var(--acc)"></div></div>'+
    '<div class="tiny muted" style="margin-top:7px">Не закрывай приложение, пока идёт скачивание.</div>';
  return '<button class="btn pri wide sm" data-precache="1">Скачать все видео в телефон · 35 МБ</button>'+
    '<div class="tiny muted" style="margin-top:8px">Сделай это один раз по wi-fi. После этого приложение '+
    'работает в зале без интернета — видео берутся из памяти телефона.</div>';
}
async function offCount(){ try{ const c=await caches.open("trn-v1"); const ks=await c.keys();
  return ks.filter(r=>r.url.indexOf("/videos/")>=0).length; }catch(e){ return 0; } }
async function offRefresh(){
  const chip=$("#offchip"); if(!chip) return;
  const n=await offCount(), t=allMedia().length;
  chip.textContent = n>=t ? "всё скачано" : (n? n+" из "+t : "не скачано");
  chip.className = "chip"+(n>=t?" g":"");
}
async function startPrecache(){
  try{
    const reg=await navigator.serviceWorker.ready;
    OFF.busy=true; OFF.done=0; const urls=allMedia(); OFF.total=urls.length;
    const b=$("#offbox"); if(b) b.innerHTML=offBox();
    (reg.active||navigator.serviceWorker.controller).postMessage({type:"precache",urls:urls});
  }catch(e){ toast("Не получилось запустить скачивание"); OFF.busy=false; }
}
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",ev=>{
    const d=ev.data||{};
    if(d.type==="precache-progress"){ OFF.done=d.done; OFF.total=d.total;
      const b=$("#offbox"); if(b) b.innerHTML=offBox(); }
    if(d.type==="precache-done"){ OFF.busy=false;
      const b=$("#offbox"); if(b) b.innerHTML=offBox(); offRefresh();
      toast(d.failed? ("Скачано, кроме "+d.failed+" файлов") : "Все видео в телефоне 👍"); }
  });
}

/* ---------- actions ---------- */
function startWorkout(){ const d=nextDay();
  S.active={date:todayISO(),cycle:curCycle(),day:d.n,ex:{},note:""}; flush(); render(); }
function finishWorkout(){
  const a=S.active; if(!a) return;
  let any=false;
  Object.keys(a.ex).forEach(k=>{
    const e=a.ex[k], done=e.sets.filter(s=>s.r&&s.w);
    if(!done.length) return; any=true;
    const st=S.ex[k]||(S.ex[k]={hist:[],note:""}); st.hist=st.hist||[];
    const f=done[0];
    st.hist.push({date:a.date,w:+f.w,r:+f.r,sets:done.map(s=>({w:+s.w,r:+s.r}))});
    st.last={w:+f.w,r:+f.r,date:a.date};
    st.bump=(+f.r)>=10;
  });
  if(!any&&!confirm("Ни одного подхода не записано. Всё равно завершить?")) return;
  S.hist.push(a); S.active=null; S.pos=(S.pos+1)%4; flush();
  TAB="home"; render(); toast("Тренировка записана 💪");
}
function setVal(k,i,fld,v){ const a=S.active; if(!a) return;
  const e=a.ex[k]||(a.ex[k]={warm:{w:"",r:""},sets:[],note:""});
  if(i<0) e.warm[fld]=v; else { while(e.sets.length<=i) e.sets.push({w:"",r:""}); e.sets[i][fld]=v; }
  save(); }
function addFoodFromForm(){
  const n=$("#fn").value.trim(),g=+$("#fg").value,p=+$("#fp").value||0,f=+$("#ff").value||0,c=+$("#fc").value||0;
  if(!n) return toast("Впиши название");
  if(!g||g<=0) return toast("Впиши сколько грамм");
  if(!p&&!f&&!c) return toast("Впиши БЖУ на 100 г");
  dayFood(foodDate||todayISO()).items.push({n:n,g:g,p:p*g/100,f:f*g/100,c:c*g/100});
  const i=S.lib.findIndex(l=>l.n.toLowerCase()===n.toLowerCase());
  if(i>=0) S.lib.splice(i,1);
  S.lib.unshift({n:n,p100:p,f100:f,c100:c}); S.lib=S.lib.slice(0,60);
  flush(); render(); toast("Добавлено");
}
function exportData(){ const b=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="trenirovki-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000); toast("Копия сохранена"); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-tab2],[data-tog],[data-begin],[data-finish],[data-skip],[data-tick],"+
    "[data-addset],[data-rest],[data-fd],[data-addfood],[data-lib],[data-del],[data-pt],[data-pc],[data-pd],"+
    "[data-photo],[data-ph],[data-exp],[data-imp],[data-reset],[data-seen],[data-precache]");
  if(!t) return;
  const D=t.dataset;
  if(D.tab){ TAB=D.tab; if(TAB==="plan") progDay=null; render(); return; }
  if(D.tab2){ TAB=D.tab2; render(); return; }
  if(D.seen){ S.seen=true; flush(); render(); return; }
  if(D.tog!==undefined){
    const card=t.closest(".ex"),body=card.querySelector(".exb"),open=body.style.display!=="none";
    $("#screen").querySelectorAll(".ex .exb").forEach(b=>{ b.style.display="none"; b.innerHTML=""; b.closest(".ex").classList.remove("on"); });
    if(!open){ const mode=(TAB==="work"&&S.active)?"work":"view";
      body.innerHTML=exBody(findEx(D.tog),mode); body.style.display="block"; card.classList.add("on"); bindVideos(body);
      setTimeout(()=>card.scrollIntoView({behavior:"smooth",block:"start"}),60); }
    return; }
  if(D.begin){ startWorkout(); return; }
  if(D.finish){ if(confirm("Завершить тренировку и записать результат?")) finishWorkout(); return; }
  if(D.skip){ S.pos=(S.pos+1)%4; flush(); render(); return; }
  if(D.tick!==undefined){ const k=D.tick,i=+D.i,a=S.active; if(!a) return;
    const st=a.ex[k]; if(!st||!st.sets[i]||!st.sets[i].r) return toast("Сначала впиши повторы");
    t.classList.toggle("on"); restStart(restSecFor(findEx(k)),(i+1)+" подход · "+dispName(k)); return; }
  if(D.addset){ const a=S.active; if(!a) return;
    const st=a.ex[D.addset]||(a.ex[D.addset]={warm:{w:"",r:""},sets:[],note:""});
    st.sets.push({w:"",r:""}); flush();
    const b=$("#ex-"+D.addset+" .exb"); b.innerHTML=exBody(findEx(D.addset),"work"); bindVideos(b); return; }
  if(D.rest){ restStart(+D.rest); return; }
  if(D.fd){ const d=parseISO(foodDate||todayISO()); d.setDate(d.getDate()+ +D.fd);
    if(todayISO(d)>todayISO()) return; foodDate=todayISO(d); render(); return; }
  if(D.addfood){ addFoodFromForm(); return; }
  if(D.lib!==undefined){ const l=S.lib[+D.lib];
    $("#fn").value=l.n; $("#fp").value=l.p100; $("#ff").value=l.f100; $("#fc").value=l.c100; $("#fg").focus(); return; }
  if(D.del!==undefined){ dayFood(foodDate||todayISO()).items.splice(+D.del,1); flush(); render(); return; }
  if(D.pt){ progTab=D.pt; render(); return; }
  if(D.pc){ progCyc=+D.pc; progDay=null; render(); return; }
  if(D.pd!==undefined){ progDay=D.pd===""?null:+D.pd; render(); return; }
  if(D.photo){ $("#phin").click(); return; }
  if(D.ph){ if(confirm("Удалить это фото?")) photoDel(+D.ph).then(loadPhotos); return; }
  if(D.precache){ startPrecache(); return; }
  if(D.exp){ exportData(); return; }
  if(D.imp){ $("#impin").click(); return; }
  if(D.reset){ if(confirm("Стереть ВСЁ: тренировки, веса, еду и настройки? Отменить будет нельзя."))
    { localStorage.removeItem("trn"); load(); render(); toast("Данные стёрты"); } return; }
});
document.addEventListener("input",e=>{
  const t=e.target,D=t.dataset;
  if(D.k&&D.s){
    setVal(D.k,+D.i,D.s,t.value);
    if(D.s==="r"){ const tr=t.closest("tr"); if(tr) tr.classList.toggle("filled",!!t.value); }
    if(D.s==="w"&&+D.i===0){ const a=S.active&&S.active.ex[D.k];
      if(a) a.sets.forEach((s,i)=>{ if(i>0&&!s.w){ s.w=t.value;
        const el=$('input[data-k="'+D.k+'"][data-s="w"][data-i="'+i+'"]'); if(el) el.value=t.value; } });
      save(); } }
  else if(D.note!==undefined){ const st=S.ex[D.note]||(S.ex[D.note]={hist:[]}); st.note=t.value; save(); }
  else if(D.snote&&S.active){ S.active.note=t.value; save(); }
  else if(D.bw!==undefined){ dayFood(foodDate||todayISO()).w=t.value?+t.value:null; save(); }
  else if(D.cs!==undefined){ S.set.carbStep=Math.max(0,+t.value||0); save(); }
  else if(D.rs!==undefined){ S.set.restSec=Math.max(30,+t.value||180); save(); }
});
document.addEventListener("change",e=>{
  const t=e.target,D=t.dataset;
  if(D.pe){ progEx=t.value; render(); return; }
  if(D.co!==undefined){ S.cycleOverride=+t.value; flush(); render(); return; }
  if(D.sdate!==undefined&&t.value){ S.start=t.value; flush(); render(); return; }
  if(t.id==="phin"&&t.files[0]) addPhoto(t.files[0]);
  if(t.id==="impin"&&t.files[0]){ const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result);
        if(!o||typeof o!=="object"||!("hist" in o)) throw 0;
        if(confirm("Заменить текущие данные данными из копии?")){
          S=Object.assign({},DEF,o); S.set=Object.assign({},DEF.set,o.set||{});
          flush(); render(); toast("Данные восстановлены"); } }
      catch(err){ toast("Не удалось прочитать файл"); } };
    r.readAsText(t.files[0]); }
});
document.addEventListener("toggle",e=>{
  if(e.target.tagName!=="DETAILS"||!e.target.open) return;
  const a=e.target.querySelector("#voice");
  if(a&&!a.getAttribute("src")) a.src="videos/voice.m4a";
},true);

$("#rstop").onclick=restStop;
$("#radd").onclick=()=>{ rEnd+=30000; rTot+=30; restTick(); };
window.addEventListener("pagehide",flush);
window.addEventListener("beforeunload",flush);

load(); render();

</script>
</body>
</html>
